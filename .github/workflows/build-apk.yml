name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Parkmember-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Parkmember-debug-apk
          path: Parkmember-debug.apk

      - name: Publish to "latest-debug" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Parkmember (latest debug build)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "Debug APK built from ${{ github.ref_name }} @ ${{ github.sha }}"
          files: Parkmember-debug.apk

  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/qa.sh

      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            qa-screenshots/
          if-no-files-found: ignore

      - name: Publish screenshots to "qa-screenshots" release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qa-screenshots
          name: QA screenshots (latest emulator run)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "Emulator screenshots from ${{ github.ref_name }} @ ${{ github.sha }}"
          files: qa-screenshots/*.png
          fail_on_unmatched_files: false
