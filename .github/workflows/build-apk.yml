name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Parkmember-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Parkmember-debug-apk
          path: Parkmember-debug.apk

      - name: Publish to "latest-debug" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Parkmember (latest debug build)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "Debug APK built from ${{ github.ref_name }} @ ${{ github.sha }}"
          files: Parkmember-debug.apk
